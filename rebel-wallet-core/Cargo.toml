[package]
name = "rebel-wallet-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
regtest = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bark = { package = "bark-wallet", git = "https://gitlab.com/benthecarman/bark.git", rev = "3ec92d287a65195d73463c7f186ed4b1387fbf57", default-features = false, features = ["sqlite-bundled", "native", "tls-webpki-roots", "rand"] }
bech32 = "0.11"
bip39 = { version = "2", features = ["rand"] }
bitcoin = "0.32"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flume = "0.11"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lightning-invoice = "0.34"
nostr = { version = "0.45.0-alpha.1", features = ["nip04", "nip47"] }
nostr-sdk = "0.45.0-alpha.1"
nwc-mobile = { git = "https://github.com/ntheile/nwc-mobile", rev = "4a996e9a60e0824f61278d8e79e9e2d2022abe9f" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.31" }
secp256k1 = { version = "0.29", features = ["rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", default-features = false }
uniffi = "0.31.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
